<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lockrythm 2.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div style="display:flex; align-items:center;">
                    <img id="my-avatar" class="avatar" src="https://via.placeholder.com/40" alt="Me">
                    <span id="my-name" style="font-weight:bold; font-size: 0.9rem;">Loading...</span>
                </div>
                <button class="icon-btn" id="logout-btn" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
            <div class="user-list" id="user-list">
                <div style="padding:20px; text-align:center; color:#666;">Loading contacts...</div>
            </div>
        </div>

        <div class="chat-area" id="chat-area">
            <div class="chat-header" id="chat-header" style="display:none;">
                <div style="display:flex; align-items:center;">
                    <img id="chat-avatar" class="avatar" src="">
                    <div>
                        <div id="chat-name" style="font-weight:bold;">User</div>
                        <div id="chat-status" style="font-size:0.75rem; color:var(--primary);">Online</div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="video-call-btn" title="Video Call"><i class="fas fa-video"></i></button>
                    <button class="icon-btn" id="audio-call-btn" title="Audio Call"><i class="fas fa-phone"></i></button>
                </div>
            </div>

            <div class="messages-container" id="messages-container">
                <div class="welcome-msg" style="text-align: center; margin-top: 20%;">
                    <i class="fas fa-lock" style="font-size: 3rem; margin-bottom: 20px; color: #333;"></i>
                    <h3>Welcome to Lockrythm</h3>
                    <p style="color: #666;">Select a contact to start encryption.</p>
                </div>
            </div>

            <div class="input-area" id="input-area" style="display:none;">
                <input type="file" id="media-input" hidden accept="image/*,video/*">
                
                <button class="icon-btn" onclick="document.getElementById('media-input').click()" title="Send Photo/Video">
                    <i class="fas fa-paperclip"></i>
                </button>

                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                
                <button class="icon-btn" id="mic-btn" title="Record Voice">
                    <i class="fas fa-microphone"></i>
                </button>

                <button class="icon-btn" id="send-btn" style="color:var(--primary); display:none;">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            
            <div id="recording-overlay" style="display:none; position:absolute; bottom:80px; left:50%; transform:translateX(-50%); background:red; color:white; padding:10px 20px; border-radius:20px; box-shadow: 0 4px 15px rgba(255,0,0,0.3); align-items: center; gap: 10px;">
                <i class="fas fa-circle-notch fa-spin"></i> 
                <span>Recording...</span>
                <button id="cancel-rec-btn" style="background:none; border:none; color:white; cursor:pointer; font-weight:bold; font-size: 1.2rem;">&times;</button>
            </div>
        </div>
    </div>

    <div id="call-modal">
        <div class="call-wrapper" style="text-align: center;">
            <div style="color:white; margin-bottom:15px; font-size:1.2rem;" id="call-status">Calling...</div>
            <div class="video-grid" style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                <video id="remoteVideo" autoplay playsinline style="max-width: 100%; border-radius: 10px; background: #000;"></video>
                <video id="localVideo" autoplay playsinline muted style="width: 150px; position: absolute; bottom: 20px; right: 20px; border: 2px solid white; border-radius: 8px;"></video>
            </div>
            <button class="auth-btn" style="background:red; width: auto; padding: 10px 30px; margin-top: 20px;" id="hangup-btn">
                <i class="fas fa-phone-slash"></i> End Call
            </button>
        </div>
    </div>

    <script type="module" src="js/chat.js"></script>
</body>
</html>
